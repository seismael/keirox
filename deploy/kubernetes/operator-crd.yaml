apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keiroxclusters.core.keirox.io
spec:
  group: core.keirox.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                version:
                  type: string
                storage:
                  type: object
                  properties:
                    size:
                      type: string
                    storageClassName:
                      type: string
                config:
                  type: object
                  additionalProperties:
                    type: string
  scope: Namespaced
  names:
    plural: keiroxclusters
    singular: keiroxcluster
    kind: KeiroxCluster
    shortNames:
      - kx
